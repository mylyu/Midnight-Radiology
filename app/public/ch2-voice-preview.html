<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>第二章 · 配音修订试听</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#0c1421;color:#e5e9f0;font:16px/1.6 system-ui,sans-serif}main{max-width:1050px;margin:auto;padding:24px}h1{font-size:26px;margin-bottom:8px}p{color:#aebed1}.toolbar{display:flex;gap:12px;flex-wrap:wrap;margin:20px 0}button,a{font:inherit}button{background:#203248;border:1px solid #52738d;color:#e6f1fb;padding:8px 16px;border-radius:6px;cursor:pointer}a{color:#8bdad3}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:15px}.card{border:1px solid #31415a;border-radius:8px;background:#131e30;padding:18px}.card h2{font-size:18px;margin:0 0 12px}.new{font-size:21px;color:#a9ede2;margin:8px 0}.old{font-size:14px;color:#99a9bc;min-height:44px}.label{display:block;font-size:13px;color:#9aaab9}audio{width:100%;height:36px;margin:6px 0 12px}#status{min-height:26px;color:#edca86}.note{font-size:14px}
</style>
<main><h1>第二章 · 配音修订</h1>
<p><strong>小凯配音更新：</strong>作者已选用无参考B；下方列表保留早期配音记录，当前小凯请听<a href="ch2-kai-no-reference-preview.html?v=selected-b">已选用B与A的对照</a>。</p>
<p>按9月21日指定台词重配5条；晨会、雯雯恢复原版；值班医师、复查大爷取消语音。其余保留，此页不读写游戏存档。</p>
<div class="toolbar"><button id="all">连听当前配音</button><button id="stop">停止</button><a href="./#/ch2">回到第二章</a></div>
<div id="status" aria-live="polite"></div><div class="grid" id="grid"></div>
<p class="note">新声用 AuK-Flash 和固定声音参考合成。识别与音频完整性已单独核查；是否自然、像这个人物，请以你的试听为准。游戏中的剧情正文没有压成短句。</p></main>
<script>
const rows=[{"key":"zhou","role":"老周","step":"c2n1_4","id":"vox_ch2_natural_zhou_v2","text":"你来扫，我去泡杯茶。","status":"本次重配"},{"key":"tang","role":"小唐","step":"c2n1_2","id":"vox_ch2_natural_tang","text":"哎，你来啦。","status":"保留"},{"key":"fan_a","role":"老范","step":"c2n1_ab2","id":"vox_ch2_natural_fan_a","text":"才三天，就坏了。","status":"保留"},{"key":"fan_b","role":"老范","step":"c2n1_an2","id":"vox_ch2_natural_fan_b","text":"这台先留着吧。","status":"保留"},{"key":"kai","role":"小凯","step":"c2n1_b1","id":"vox_ch2_natural_kai_v2","text":"跟你说个事儿。","status":"本次重配"},{"key":"lei","role":"小雷","step":"c2n1_e1","id":"vox_ch2_natural_lei_v2","text":"新机器接入packs了。","status":"本次重配"},{"key":"he","role":"小何","step":"c2n1_m1","id":"vox_ch2_natural_he_v2","text":"老爷子夜里坠床，要拍头颅CT。","status":"本次重配"},{"key":"director","role":"主任","step":"c2d2_1","id":"vox_ch2_natural_director_v2","text":"年轻人，动作快起来！","status":"本次重配"},{"key":"director_am","role":"主任","step":"c2am_1","id":"vox2_director_am","text":"年轻人不错啊，我出几道题考考你。","status":"恢复原配音"},{"key":"wen","role":"雯雯","step":"c2n3_a1","id":"vox2_wen","text":"加班加到十点的销售，您见过没？","status":"恢复原配音"},{"key":"uncle","role":"复查大爷","step":"c2d2_7","id":null,"text":"哦，这回看清了。","status":"不配音"},{"key":"kiddad","role":"孩子父亲","step":"c2n5_m1","id":"vox_ch2_natural_kiddad","text":"他又吐了，您看看。","status":"保留"},{"key":"kidmom","role":"孩子母亲","step":"c2n5_m2","id":"vox_ch2_natural_kidmom","text":"可前几天才查过。","status":"保留"},{"key":"duty","role":"值班医师","step":"c2n5_m7a","id":null,"text":"先把旧片发来。","status":"不配音"}];
let active=null,run=0;
const audios=[];
for(const r of rows){
 const card=document.createElement('section');card.className='card';
 const title=document.createElement('h2');title.textContent=r.role+(r.key==='fan_a'?' · 配件支线A':r.key==='fan_b'?' · 配件支线B':r.key==='director_am'?' · 晨会':'');card.append(title);
 const status=document.createElement('div');status.className='label';status.textContent=r.status;card.append(status);
 const line=document.createElement('div');line.className='new';line.textContent=r.id?r.text:'只保留文字，不播放人声';card.append(line);
 if(r.id){
  const audio=document.createElement('audio');audio.controls=true;audio.preload='none';audio.volume=.45;audio.src='./audio/'+r.id+'.mp3?v=author-20260921';
  audio.setAttribute('aria-label',r.role+'当前配音');
  audio.addEventListener('play',()=>{if(active&&active!==audio)active.pause();active=audio});
  card.append(audio);audios.push({audio,r});
 }
 document.querySelector('#grid').append(card);
}
document.querySelector('#stop').onclick=()=>{run++;if(active){active.pause();active.currentTime=0}document.querySelector('#status').textContent='已停止'};
document.querySelector('#all').onclick=async()=>{
 const token=++run;
 for(const {audio,r} of audios){
  if(token!==run)return;
  document.querySelector('#status').textContent=r.role+'：'+r.text;audio.currentTime=0;
  try{
   await new Promise((resolve,reject)=>{
    const cleanup=()=>{audio.removeEventListener('ended',end);audio.removeEventListener('pause',pause);audio.removeEventListener('error',error)};
    const end=()=>{cleanup();resolve()};const pause=()=>{cleanup();resolve()};const error=()=>{cleanup();reject(new Error('音频读取失败'))};
    audio.addEventListener('ended',end);audio.addEventListener('pause',pause);audio.addEventListener('error',error);
    audio.play().catch(e=>{cleanup();reject(e)});
   });
  }catch(e){document.querySelector('#status').textContent=r.role+'：'+e.message;return}
  await new Promise(resolve=>setTimeout(resolve,650));
 }
 if(token===run)document.querySelector('#status').textContent='试听完毕';
};
</script></html>
